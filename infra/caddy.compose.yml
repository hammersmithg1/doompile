name: doompile-edge
services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    network_mode: host
    environment:
      DOOMPILE_PROD_URL: ${DOOMPILE_PROD_URL:?Set the production origin}
      DOOMPILE_STAGING_URL: ${DOOMPILE_STAGING_URL:?Set the staging origin}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${DOOMPILE_EDGE_RUNTIME:-../runtime}/caddy/data:/data
      - ${DOOMPILE_EDGE_RUNTIME:-../runtime}/caddy/config:/config
      - ${DOOMPILE_EDGE_RUNTIME:-../runtime}/logs/caddy:/logs
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    logging:
      driver: local
      options: {max-size: 10m, max-file: '3'}
