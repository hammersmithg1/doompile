name: ${DOOMPILE_COMPOSE_PROJECT:-doompile}
services:
  app:
    image: ${DOOMPILE_APP_IMAGE:-doompile-app:development}
    build:
      context: ..
      dockerfile: infra/Dockerfile
      args:
        DOOMPILE_BUILD_COMMIT: ${DOOMPILE_BUILD_COMMIT:-development}
    restart: unless-stopped
    user: "1000:1000"
    ports:
      - "127.0.0.1:${DOOMPILE_PORT:-3102}:3000"
    environment:
      DOOMPILE_DATA_DIR: /data
      DOOMPILE_PUBLIC_URL: ${DOOMPILE_PUBLIC_URL:-}
      DOOMPILE_BUILD_COMMIT: ${DOOMPILE_BUILD_COMMIT:-development}
      DOOMPILE_RELEASE: ${DOOMPILE_BUILD_COMMIT:-development}
      DOOMPILE_APPLE_APP_IDS: ${DOOMPILE_APPLE_APP_IDS:-}
      DOOMPILE_MACOS_RELEASES_DIR: /releases/macos
      DOOMPILE_ALLOWED_ORIGINS: ${DOOMPILE_ALLOWED_ORIGINS:-}
      DOOMPILE_YANDEX_CLIENT_ID: ${DOOMPILE_YANDEX_CLIENT_ID:-}
      DOOMPILE_YANDEX_CLIENT_SECRET: ${DOOMPILE_YANDEX_CLIENT_SECRET:-}
      DOOMPILE_GOOGLE_CLIENT_ID: ${DOOMPILE_GOOGLE_CLIENT_ID:-}
      DOOMPILE_GOOGLE_CLIENT_SECRET: ${DOOMPILE_GOOGLE_CLIENT_SECRET:-}
      DOOMPILE_ADMIN_EMAIL: ${DOOMPILE_ADMIN_EMAIL:-}
      DOOMPILE_ADMIN_USER_ID: ${DOOMPILE_ADMIN_USER_ID:-}
      DOOMPILE_S3_ENDPOINT: http://s3:9000
      DOOMPILE_S3_REGION: us-east-1
      DOOMPILE_S3_ACCESS_KEY: ${DOOMPILE_S3_ACCESS_KEY:?Set the S3 access key}
      DOOMPILE_S3_SECRET_KEY: ${DOOMPILE_S3_SECRET_KEY:?Set the S3 secret key}
      DOOMPILE_S3_BUCKET_PREFIX: ${DOOMPILE_S3_BUCKET_PREFIX:-doompile}
    volumes:
      - ${DOOMPILE_DATA_PATH:-../runtime/staging/data}:/data
      - ${DOOMPILE_MACOS_RELEASES_PATH:-../runtime/staging/downloads/macos}:/releases/macos:ro
    depends_on:
      s3:
        condition: service_healthy
    init: true
    mem_limit: 768m
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    logging:
      driver: local
      options: {max-size: 10m, max-file: '3'}
  s3:
    image: ${DOOMPILE_MINIO_IMAGE:-doompile-minio:development}
    build:
      context: ..
      dockerfile: infra/minio.Dockerfile
    restart: unless-stopped
    user: "1000:1000"
    environment:
      MINIO_ROOT_USER: ${DOOMPILE_S3_ACCESS_KEY:?Set the S3 access key}
      MINIO_ROOT_PASSWORD: ${DOOMPILE_S3_SECRET_KEY:?Set the S3 secret key}
      MINIO_BROWSER: 'off'
      GOMEMLIMIT: 384MiB
    ports:
      - "127.0.0.1:${DOOMPILE_S3_PORT:-9102}:9000"
    volumes:
      - ${DOOMPILE_S3_DATA_PATH:-../runtime/staging/s3}:/data
    healthcheck:
      test: [CMD, curl, -fsS, 'http://127.0.0.1:9000/minio/health/ready']
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 15
    mem_limit: 768m
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    logging:
      driver: local
      options: {max-size: 10m, max-file: '3'}
